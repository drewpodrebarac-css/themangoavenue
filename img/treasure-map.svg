<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Georgia, serif">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15A3B0"/><stop offset="100%" stop-color="#0A5560"/>
    </linearGradient>
  </defs>

  <!-- parchment -->
  <rect x="8" y="8" width="1184" height="624" rx="26" fill="#FBEED3" stroke="#D9C49A" stroke-width="6"/>
  <rect x="22" y="22" width="1156" height="596" rx="18" fill="none" stroke="#C8AE7E" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
  <circle cx="150" cy="120" r="60" fill="#EED9AE" opacity="0.35"/>
  <circle cx="1020" cy="180" r="80" fill="#EED9AE" opacity="0.3"/>
  <circle cx="700" cy="90" r="46" fill="#EED9AE" opacity="0.3"/>

  <!-- title -->
  <text x="600" y="78" text-anchor="middle" font-size="40" font-weight="bold" fill="#7A5A2E" font-style="italic">~ Mapa del Tesoro · El Tunco ~</text>

  <!-- ocean along the bottom -->
  <path d="M0,480 C150,452 300,506 460,482 C640,456 800,510 980,484 C1080,470 1140,486 1200,476 L1200,640 L0,640 Z" fill="url(#sea)" opacity="0.85"/>
  <g stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M120,520 q16,-16 32,0 q16,16 32,0"/>
    <path d="M420,545 q16,-16 32,0 q16,16 32,0"/>
    <path d="M760,530 q16,-16 32,0 q16,16 32,0"/>
    <path d="M1020,555 q16,-16 32,0 q16,16 32,0"/>
  </g>

  <!-- compass rose -->
  <g transform="translate(1080,110)">
    <circle r="42" fill="none" stroke="#7A5A2E" stroke-width="3"/>
    <path d="M0,-38 L8,0 L0,38 L-8,0 Z" fill="#C94F3D"/>
    <path d="M-38,0 L0,-8 L38,0 L0,8 Z" fill="#7A5A2E"/>
    <text y="-50" text-anchor="middle" font-size="20" fill="#7A5A2E" font-weight="bold">N</text>
  </g>

  <!-- palms -->
  <g stroke="#2E5E4E" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M250,330 C252,300 250,280 244,262"/>
    <path d="M244,262 C226,252 210,254 198,264 M244,262 C244,242 252,230 266,224 M244,262 C262,252 280,254 292,266"/>
    <path d="M900,300 C902,272 900,254 894,238"/>
    <path d="M894,238 C878,228 862,230 852,240 M894,238 C894,220 902,208 914,204 M894,238 C910,228 926,230 938,240"/>
  </g>

  <!-- THE SHOP -->
  <g transform="translate(560,220)">
    <!-- mango tree above shop -->
    <circle cx="34" cy="-58" r="34" fill="#2E5E4E"/>
    <circle cx="10" cy="-44" r="24" fill="#3C7A5E"/>
    <circle cx="26" cy="-38" r="6" fill="#FFB03A"/>
    <circle cx="44" cy="-52" r="6" fill="#FFB03A"/>
    <circle cx="14" cy="-62" r="6" fill="#FFB03A"/>
    <rect x="28" y="-30" width="10" height="26" fill="#7A5A2E"/>
    <!-- shop -->
    <rect x="-58" y="-4" width="120" height="66" rx="6" fill="#FFFDF8" stroke="#7A5A2E" stroke-width="4"/>
    <rect x="-58" y="-4" width="120" height="18" fill="#FF6B4A"/>
    <rect x="-30" y="26" width="26" height="36" fill="#0E7C86"/>
    <rect x="8" y="22" width="34" height="22" fill="#15A3B0" opacity="0.5" stroke="#7A5A2E" stroke-width="2"/>
    <text x="2" y="92" text-anchor="middle" font-size="26" font-weight="bold" fill="#C94F3D">MANGO AVENUE</text>
    <text x="2" y="116" text-anchor="middle" font-size="17" fill="#7A5A2E" font-style="italic">start here · empieza aquí</text>
  </g>

  <!-- trail to LA BOCANA (short, left) -->
  <path d="M500,300 C420,330 360,360 320,412" fill="none" stroke="#C94F3D" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round"/>
  <g transform="translate(305,440) rotate(-6)">
    <path d="M-20,-20 L20,20 M-20,20 L20,-20" stroke="#C94F3D" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="298" y="402" text-anchor="middle" font-size="24" font-weight="bold" fill="#7A5A2E">La Bocana</text>
  <g transform="translate(392,352)">
    <rect x="-52" y="-20" width="104" height="34" rx="17" fill="#FFFDF8" stroke="#C94F3D" stroke-width="3"/>
    <text y="4" text-anchor="middle" font-size="19" font-weight="bold" fill="#C94F3D">🚶 1 min!</text>
  </g>
  <path d="M255,486 q14,-18 30,-6 q-4,-16 14,-20 q18,-4 24,12 q14,-8 22,4" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- trail to EL SUNZAL (long, winding right) -->
  <path d="M640,300 C740,320 800,300 860,330 C920,360 940,400 1000,430" fill="none" stroke="#0E7C86" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round"/>
  <g transform="translate(1020,452) rotate(8)">
    <path d="M-20,-20 L20,20 M-20,20 L20,-20" stroke="#C94F3D" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="1030" y="415" text-anchor="middle" font-size="24" font-weight="bold" fill="#7A5A2E">El Sunzal</text>
  <g transform="translate(880,318)">
    <rect x="-56" y="-20" width="112" height="34" rx="17" fill="#FFFDF8" stroke="#0E7C86" stroke-width="3"/>
    <text y="4" text-anchor="middle" font-size="19" font-weight="bold" fill="#0A5560">🚶 10 min</text>
  </g>
  <path d="M960,500 q16,-20 34,-7 q-5,-18 16,-22 q20,-5 27,13 q15,-9 24,4" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Mira Surf landmark -->
  <g transform="translate(700,180)">
    <rect x="-40" y="-14" width="80" height="34" rx="5" fill="#EED9AE" stroke="#7A5A2E" stroke-width="2.5"/>
    <text y="8" text-anchor="middle" font-size="15" fill="#7A5A2E" font-weight="bold">Mira Surf</text>
  </g>

  <!-- footer scroll note -->
  <text x="600" y="612" text-anchor="middle" font-size="19" fill="#7A5A2E" font-style="italic">X marks the waves 🌊 · treasure guaranteed daily</text>
</svg>
